<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechNova IT Solutions</title>
    
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Open+Sans:wght@300;400;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: 'var(--color-brand-50)',
                100: 'var(--color-brand-100)',
                500: 'var(--color-brand-500)',
                600: 'var(--color-brand-600)',
                700: 'var(--color-brand-700)',
                800: 'var(--color-brand-800)',
                900: 'var(--color-brand-900)',
              }
            },
            fontFamily: {
              sans: ['var(--font-family)', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default Blue Theme */
        --color-brand-50: #eff6ff;
        --color-brand-100: #dbeafe;
        --color-brand-500: #3b82f6;
        --color-brand-600: #2563eb;
        --color-brand-700: #1d4ed8;
        --color-brand-800: #1e40af;
        --color-brand-900: #1e3a8a;
        --font-family: 'Inter'; /* Default Font */
        color-scheme: light;
      }
      body {
        background-color: #ffffff;
        color: #111827;
        font-family: var(--font-family), ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      input, textarea, select {
        background-color: #ffffff;
        color: #111827;
        border-color: #d1d5db;
      }
      input::placeholder, textarea::placeholder, select::placeholder {
        color: #9ca3af;
      }
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px white inset !important;
          -webkit-text-fill-color: #111827 !important;
          caret-color: #111827 !important;
      }
      
      /* Dark mode overrides (if enabled via class) */
      html.dark body {
        background-color: #111827;
        color: #f3f4f6;
      }
    </style>
  
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
